[package]
name = "assignment-manager-desktop"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "assignment-manager-desktop"

[[bin]]
name = "list-smoke"
path = "smoke/main.rs"
required-features = ["smoke-test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
assignment-manager = { path = ".." }
assignment-manager-application = { path = "../crates/application" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1"
tempfile = "3"
zeroize = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[features]
# Also permits `cargo run --features custom-protocol` without a frontend server.
custom-protocol = ["tauri/custom-protocol"]
# Separate synthetic-data executable, excluded from ordinary app builds.
smoke-test = []
