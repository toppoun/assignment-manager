[package]
name = "assignment-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
# Fixed loopback-only university fixture for explicit offline tests/examples.
synthetic-https-fixture = []

[dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["non-fips"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hyper = { version = "1", default-features = false }
ical = { version = "0.11", default-features = false, features = ["ical"] }
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "cookies", "json", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["net", "time"] }
zeroize = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring-core = "1"
rpassword = "7.5.4"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
security-framework = "3.7"
